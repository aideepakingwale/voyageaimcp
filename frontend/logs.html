<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>VoyageAI — Log Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#040C18;--bg2:#071830;--bg3:#0A1E30;--border:#0D2840;
      --teal:#00C9A7;--blue:#3BAADB;--amber:#F39C12;--red:#E74C3C;
      --green:#27AE60;--purple:#9B59B6;--text:#E8F4FD;--muted:#7FB3D3;
      --dim:#3D5A6B;--font:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--font);
         display:grid;grid-template-columns:240px 1fr;height:100vh;overflow:hidden}

    /* Sidebar */
    .sidebar{background:var(--bg2);border-right:1px solid var(--border);
      display:flex;flex-direction:column;overflow:hidden}
    .sb-head{padding:16px;border-bottom:1px solid var(--border)}
    .sb-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
    .sb-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .back-link{display:block;font-size:12px;color:var(--teal);margin-top:8px;text-decoration:none}
    .back-link:hover{text-decoration:underline}
    .file-list{flex:1;overflow-y:auto;padding:8px}
    .file-item{padding:10px 12px;border-radius:8px;cursor:pointer;
      border:1px solid transparent;margin-bottom:4px;transition:all .2s}
    .file-item:hover{background:var(--bg3);border-color:var(--border)}
    .file-item.active{background:rgba(0,201,167,.08);border-color:var(--teal)}
    .fi-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
    .fi-meta{font-size:11px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
    .fi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .dot-app{background:var(--teal)}   .dot-api{background:var(--blue)}
    .dot-mcp{background:var(--amber)}  .dot-llm{background:var(--purple)}
    .dot-guardrails{background:var(--green)} .dot-auth{background:#E91E8C}
    .dot-errors{background:var(--red)}

    /* Main */
    .main{display:flex;flex-direction:column;overflow:hidden}
    .toolbar{padding:12px 16px;border-bottom:1px solid var(--border);
      background:var(--bg2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .title-area{flex:1}
    .log-title{font-size:15px;font-weight:700}
    .log-meta{font-size:12px;color:var(--muted)}

    /* Search / controls */
    .search-input{background:var(--bg3);border:1px solid var(--border);
      color:var(--text);font-family:var(--mono);font-size:13px;
      padding:7px 12px;border-radius:8px;outline:none;width:240px}
    .search-input:focus{border-color:var(--teal)}
    .select{background:var(--bg3);border:1px solid var(--border);
      color:var(--text);font-family:var(--font);font-size:12px;
      padding:7px 10px;border-radius:8px;cursor:pointer;outline:none}
    .btn{padding:7px 14px;border-radius:8px;font-family:var(--font);
      font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
    .btn-teal{background:var(--teal);color:#040C18}
    .btn-teal:hover{background:#00A88A}
    .btn-dim{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
    .btn-dim:hover{border-color:var(--blue);color:var(--blue)}

    /* Log table */
    .log-area{flex:1;overflow-y:auto;padding:0}
    .log-area::-webkit-scrollbar{width:5px}
    .log-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    .log-row{display:grid;grid-template-columns:80px 64px 140px 1fr;gap:0;
      border-bottom:1px solid rgba(13,40,64,.6);font-size:12px;font-family:var(--mono);
      padding:5px 12px;align-items:center;cursor:pointer;transition:background .15s}
    .log-row:hover{background:var(--bg2)}
    .log-row.expanded{background:rgba(0,201,167,.04)}
    .log-row.lvl-ERROR,.log-row.lvl-CRITICAL{background:rgba(231,76,60,.06)}
    .log-row.lvl-WARNING{background:rgba(243,156,18,.04)}
    .ts{color:var(--dim)}
    .lvl{font-weight:700;font-size:11px;padding:2px 5px;border-radius:4px;text-align:center}
    .lvl-DEBUG{color:var(--dim)}
    .lvl-INFO{color:var(--teal)}
    .lvl-WARNING{color:var(--amber)}
    .lvl-ERROR,.lvl-CRITICAL{color:var(--red)}
    .logger-name{color:var(--blue);font-size:11px}
    .msg{color:var(--text)}
    .extra-row{display:none;background:var(--bg3);border-bottom:1px solid var(--border);
      padding:10px 16px;font-family:var(--mono);font-size:12px;
      white-space:pre-wrap;word-break:break-all;color:var(--muted);
      border-left:3px solid var(--border)}
    .extra-row.visible{display:block}
    .extra-row .key{color:var(--blue)}
    .extra-row .val-str{color:var(--teal)}
    .extra-row .val-num{color:var(--amber)}
    .extra-row .val-bool{color:var(--purple)}
    .extra-row .val-err{color:var(--red)}

    /* Empty / loading */
    .empty{text-align:center;padding:60px 20px;color:var(--dim)}
    .empty h3{font-size:16px;margin-bottom:8px}
    .pulse{animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-head">
    <div class="sb-title">📋 Log Viewer</div>
    <div class="sb-sub">VoyageAI Debug Console</div>
    <a class="back-link" href="/">← Back to App</a>
  </div>
  <div class="file-list" id="fileList">
    <div class="empty pulse" style="padding:20px;font-size:12px">Loading logs…</div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="toolbar">
    <div class="title-area">
      <div class="log-title" id="logTitle">Select a log file</div>
      <div class="log-meta" id="logMeta">—</div>
    </div>
    <input class="search-input" id="searchInput" placeholder="Search or request_id…">
    <select class="select" id="levelFilter">
      <option value="">All levels</option>
      <option value="DEBUG">DEBUG</option>
      <option value="INFO">INFO</option>
      <option value="WARNING">WARNING</option>
      <option value="ERROR">ERROR</option>
    </select>
    <select class="select" id="nLines">
      <option value="50">50 lines</option>
      <option value="100" selected>100 lines</option>
      <option value="250">250 lines</option>
      <option value="500">500 lines</option>
    </select>
    <button class="btn btn-teal" onclick="refresh()">↻ Refresh</button>
    <button class="btn btn-dim"  onclick="toggleAutoRefresh()">⏱ Auto</button>
  </div>

  <div class="log-area" id="logArea">
    <div class="empty">
      <h3>📂 Select a log file from the sidebar</h3>
      <p>Each subsystem writes to its own file.</p>
    </div>
  </div>
</main>

<script>
const API          = 'http://localhost:5000/api';
let currentFile    = null;
let autoRefreshIv  = null;
let autoRefreshOn  = false;

// ── Init ──────────────────────────────────────────────────────
(async () => {
  await loadFileList();
  // Auto-open errors.log if it has content
  const hash = location.hash.slice(1);
  if (hash) openLog(hash);
})();

// ── File list ──────────────────────────────────────────────────
async function loadFileList() {
  const r = await fetch(`${API}/logs`).catch(() => null);
  if (!r?.ok) {
    document.getElementById('fileList').innerHTML =
      '<div class="empty" style="padding:20px;font-size:12px;color:var(--red)">⚠ Server not reachable</div>';
    return;
  }
  const { files = [] } = await r.json();

  const DOTS = { app:'dot-app', api:'dot-api', mcp:'dot-mcp', llm:'dot-llm',
                 guardrails:'dot-guardrails', auth:'dot-auth', errors:'dot-errors' };
  const ICONS = { app:'🏠', api:'🌐', mcp:'🔌', llm:'🤖',
                  guardrails:'🛡️', auth:'🔑', errors:'🚨' };

  document.getElementById('fileList').innerHTML = files.length ? files.map(f => `
    <div class="file-item" onclick="openLog('${f.stem}')" id="fi-${f.stem}">
      <div class="fi-name">
        <div class="fi-dot ${DOTS[f.stem]||'dot-app'}"></div>
        ${ICONS[f.stem]||'📄'} ${f.stem}.log
      </div>
      <div class="fi-meta">${f.size_human} · ${f.lines.toLocaleString()} lines</div>
    </div>`).join('') :
    '<div class="empty" style="padding:20px;font-size:12px">No logs yet — make some API calls first</div>';
}

// ── Open log ───────────────────────────────────────────────────
async function openLog(stem) {
  currentFile = stem;
  location.hash = stem;

  // Highlight sidebar
  document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`fi-${stem}`)?.classList.add('active');

  document.getElementById('logTitle').textContent = `${stem}.log`;
  document.getElementById('logArea').innerHTML =
    '<div class="empty pulse" style="padding:40px">Loading…</div>';

  await loadLines();
}

// ── Load / search lines ────────────────────────────────────────
async function loadLines() {
  if (!currentFile) return;

  const q      = document.getElementById('searchInput').value.trim();
  const level  = document.getElementById('levelFilter').value;
  const n      = document.getElementById('nLines').value;

  let url;
  if (q || level) {
    url = `${API}/logs/${currentFile}/search?n=${n}`;
    if (q)     url += `&q=${encodeURIComponent(q)}`;
    if (level) url += `&level=${level}`;
  } else {
    url = `${API}/logs/${currentFile}?n=${n}`;
  }

  const r = await fetch(url).catch(() => null);
  if (!r?.ok) {
    document.getElementById('logArea').innerHTML =
      '<div class="empty" style="color:var(--red)">⚠ Failed to load log</div>';
    return;
  }

  const { lines = [], results = [], count = 0 } = await r.json();
  const rows = q || level ? results : lines;

  document.getElementById('logMeta').textContent =
    `${count || rows.length} lines${q ? ` matching "${q}"` : ''}${level ? ` · level=${level}` : ''}`;

  if (!rows.length) {
    document.getElementById('logArea').innerHTML =
      '<div class="empty"><h3>No log entries</h3><p>Make API calls to generate logs.</p></div>';
    return;
  }

  document.getElementById('logArea').innerHTML =
    rows.map((row, i) => renderRow(row, i)).join('');
}

function refresh() {
  loadFileList();
  loadLines();
}

function toggleAutoRefresh() {
  autoRefreshOn = !autoRefreshOn;
  const btn = document.querySelector('.btn-dim');
  if (autoRefreshOn) {
    btn.textContent = '⏱ Auto ON';
    btn.style.color = 'var(--teal)';
    autoRefreshIv = setInterval(refresh, 3000);
  } else {
    btn.textContent = '⏱ Auto';
    btn.style.color = '';
    clearInterval(autoRefreshIv);
  }
}

// ── Search on Enter ────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadLines();
});
document.getElementById('levelFilter').addEventListener('change', loadLines);
document.getElementById('nLines').addEventListener('change', loadLines);

// ── Row renderer ───────────────────────────────────────────────
function renderRow(row, i) {
  if (row.raw) {
    return `<div class="log-row" style="grid-template-columns:1fr">
      <span style="color:var(--dim)">${esc(row.raw)}</span></div>`;
  }

  const ts    = (row.ts||'').slice(11,23);
  const lvl   = row.level || 'INFO';
  const lgr   = (row.logger||'').replace('voyage.','');
  const msg   = row.message || '';
  const rid   = row.request_id ? `<span style="color:var(--dim);font-size:10px"> #${row.request_id}</span>` : '';

  // Build extras (exclude base fields)
  const skip = new Set(['ts','level','logger','message','module','function','line',
                        'thread','request_id','elapsed_ms','exc_info']);
  const extras = Object.entries(row).filter(([k]) => !skip.has(k));

  return `
<div class="log-row lvl-${lvl}" onclick="toggleExtra(${i})">
  <span class="ts">${ts}</span>
  <span class="lvl lvl-${lvl}">${lvl}</span>
  <span class="logger-name">${esc(lgr)}</span>
  <span class="msg">${esc(msg)}${rid}</span>
</div>
${extras.length ? `
<div class="extra-row" id="extra-${i}">
${extras.map(([k,v]) => `  <span class="key">${esc(k)}</span>: ${renderVal(v)}`).join('\n')}
</div>` : ''}`;
}

function toggleExtra(i) {
  const el = document.getElementById(`extra-${i}`);
  if (el) el.classList.toggle('visible');
}

function renderVal(v) {
  if (typeof v === 'string')  return `<span class="val-str">"${esc(v)}"</span>`;
  if (typeof v === 'number')  return `<span class="val-num">${v}</span>`;
  if (typeof v === 'boolean') return `<span class="val-bool">${v}</span>`;
  if (v === null)             return `<span class="val-bool">null</span>`;
  if (Array.isArray(v))       return `<span class="val-str">${esc(JSON.stringify(v))}</span>`;
  if (typeof v === 'object')  return `<span class="val-str">${esc(JSON.stringify(v))}</span>`;
  return esc(String(v));
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
